name: Build MediaHub APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar estrutura (descompacta se for .zip)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Descompactando $ZIP_FILE..."
              unzip -q -o "$ZIP_FILE"
            fi
            if [ -d "MediaHubAndroid" ] && [ -f "MediaHubAndroid/settings.gradle.kts" ]; then
              cp -r MediaHubAndroid/* .
            fi
          fi
          ls -la

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Salvar APK em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar instalador direto em Releases
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MediaHub APK #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
