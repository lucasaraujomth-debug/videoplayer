name: Build MediaHub APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Descompactar projeto completo e ajustar SDK
        run: |
          if [ -f "MediaHub_Android_Project_Completo.zip" ]; then
            echo "Descompactando projeto..."
            unzip -q -o MediaHub_Android_Project_Completo.zip
          fi
          # Ajusta para o Android SDK 34 pré-instalado no GitHub
          sed -i 's/compileSdk = 35/compileSdk = 34/g' app/build.gradle.kts 2>/dev/null || true
          sed -i 's/targetSdk = 35/targetSdk = 34/g' app/build.gradle.kts 2>/dev/null || true
          # Aceita licenças pendentes do Android SDK automaticamente
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Salvar APK em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar instalador direto em Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MediaHub APK #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
